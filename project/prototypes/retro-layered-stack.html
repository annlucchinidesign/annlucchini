<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retro layered stack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Bungee&family=Bangers&family=Titan+One&family=Rubik+Mono+One&display=swap" rel="stylesheet">
<style>
:root {
  --plum: #1a0b2e; --cream: #fff4e6; --coral: #ff6b5a;
  --yellow: #ffd166; --mint: #06d6a0; --violet: #b388ff;
}
* { box-sizing: border-box; }
html, body { margin: 0; overflow-x: hidden; }
body {
  background: var(--plum); color: var(--cream);
  font-family: "Bricolage Grotesque", system-ui, sans-serif;
  min-height: 100vh; display: grid; place-items: center;
  padding: 48px 16px;
}
.stage { width: 100%; max-width: 980px; }

/* ---- Reusable effect -------------------------------------------------
   Edit the custom properties below (or override per element).
   --ls-step   distance between layers
   --ls-angle  direction of the stack, measured from straight down
               (45deg = down-right, 0deg = straight down, negative = down-left)
   --ls-face   colour of the front face
   --ls-stroke outline colour and --ls-stroke-w its width
   --ls-1..6   layer colours, nearest to farthest
   data-layers="2".."6" chooses how many layers show (default 6)
   --------------------------------------------------------------------- */
.layered-stack {
  --ls-step: 0.045em;
  --ls-angle: 45deg;
  /* Offset pair per layer: step * 1.4142 * (sin, cos) of the angle. The 1.4142
     keeps the 45deg default identical to the old equal x/y offset. */
  --ls-dx: calc(1.4142 * sin(var(--ls-angle)));
  --ls-dy: calc(1.4142 * cos(var(--ls-angle)));
  --ls-face: var(--cream);
  --ls-stroke: var(--plum);
  --ls-stroke-w: 0.03em;
  --ls-1: var(--yellow);
  --ls-2: var(--coral);
  --ls-3: var(--violet);
  --ls-4: var(--yellow);
  --ls-5: var(--coral);
  --ls-6: var(--violet);
  font-weight: 800; line-height: 1.02; letter-spacing: -0.01em;
  margin: 0;
}
.layered-stack, .layered-stack .accent {
  color: var(--ls-face);
  -webkit-text-stroke: var(--ls-stroke-w) var(--ls-stroke);
  paint-order: stroke fill;
  /* Shadows are painted back to front, so the first one listed sits on top. */
  text-shadow:
    calc(var(--ls-step) * 1 * var(--ls-dx)) calc(var(--ls-step) * 1 * var(--ls-dy)) 0 var(--ls-1),
    calc(var(--ls-step) * 2 * var(--ls-dx)) calc(var(--ls-step) * 2 * var(--ls-dy)) 0 var(--ls-2),
    calc(var(--ls-step) * 3 * var(--ls-dx)) calc(var(--ls-step) * 3 * var(--ls-dy)) 0 var(--ls-3),
    calc(var(--ls-step) * 4 * var(--ls-dx)) calc(var(--ls-step) * 4 * var(--ls-dy)) 0 var(--ls-4),
    calc(var(--ls-step) * 5 * var(--ls-dx)) calc(var(--ls-step) * 5 * var(--ls-dy)) 0 var(--ls-5),
    calc(var(--ls-step) * 6 * var(--ls-dx)) calc(var(--ls-step) * 6 * var(--ls-dy)) 0 var(--ls-6);
}
/* Fewer layers: repeat the last visible colour so no gap appears. */
.layered-stack[data-layers="2"], .layered-stack[data-layers="2"] .accent {
  text-shadow:
    calc(var(--ls-step) * 1 * var(--ls-dx)) calc(var(--ls-step) * 1 * var(--ls-dy)) 0 var(--ls-1),
    calc(var(--ls-step) * 2 * var(--ls-dx)) calc(var(--ls-step) * 2 * var(--ls-dy)) 0 var(--ls-2);
}
.layered-stack[data-layers="3"], .layered-stack[data-layers="3"] .accent {
  text-shadow:
    calc(var(--ls-step) * 1 * var(--ls-dx)) calc(var(--ls-step) * 1 * var(--ls-dy)) 0 var(--ls-1),
    calc(var(--ls-step) * 2 * var(--ls-dx)) calc(var(--ls-step) * 2 * var(--ls-dy)) 0 var(--ls-2),
    calc(var(--ls-step) * 3 * var(--ls-dx)) calc(var(--ls-step) * 3 * var(--ls-dy)) 0 var(--ls-3);
}
.layered-stack[data-layers="4"], .layered-stack[data-layers="4"] .accent {
  text-shadow:
    calc(var(--ls-step) * 1 * var(--ls-dx)) calc(var(--ls-step) * 1 * var(--ls-dy)) 0 var(--ls-1),
    calc(var(--ls-step) * 2 * var(--ls-dx)) calc(var(--ls-step) * 2 * var(--ls-dy)) 0 var(--ls-2),
    calc(var(--ls-step) * 3 * var(--ls-dx)) calc(var(--ls-step) * 3 * var(--ls-dy)) 0 var(--ls-3),
    calc(var(--ls-step) * 4 * var(--ls-dx)) calc(var(--ls-step) * 4 * var(--ls-dy)) 0 var(--ls-4);
}
.layered-stack[data-layers="5"], .layered-stack[data-layers="5"] .accent {
  text-shadow:
    calc(var(--ls-step) * 1 * var(--ls-dx)) calc(var(--ls-step) * 1 * var(--ls-dy)) 0 var(--ls-1),
    calc(var(--ls-step) * 2 * var(--ls-dx)) calc(var(--ls-step) * 2 * var(--ls-dy)) 0 var(--ls-2),
    calc(var(--ls-step) * 3 * var(--ls-dx)) calc(var(--ls-step) * 3 * var(--ls-dy)) 0 var(--ls-3),
    calc(var(--ls-step) * 4 * var(--ls-dx)) calc(var(--ls-step) * 4 * var(--ls-dy)) 0 var(--ls-4),
    calc(var(--ls-step) * 5 * var(--ls-dx)) calc(var(--ls-step) * 5 * var(--ls-dy)) 0 var(--ls-5);
}
/* Headline words: the lean follows the sentence and grows word by word.
   sell 20deg, shine 30deg (down-right, gentler than the 45deg default),
   stick -45deg (the opposite way, largest tilt). */
.angle-sell  { --ls-angle: 20deg; }
.angle-shine { --ls-angle: 30deg; }
.angle-stick { --ls-angle: -45deg; }
/* Accent word: mint face, same stack. */
.layered-stack .accent { --ls-face: var(--mint); }

/* ---- Demo layout ---- */
.headline { position: relative; font-size: clamp(2.6rem, 11vw, 7.5rem); margin: 0; text-align: center; line-height: 1.02; }
.headline .lead, .headline .words { position: relative; z-index: 1; }
/* Decorative ampersand: its own row between line 2 and line 3, in normal flow. Plain glyph, reduced opacity, behind the layered words (z-index 0 vs 1). */
.headline .amp { display: block; position: relative; z-index: 0; font-size: 0.9em; line-height: 1; margin: 0.1em 0; color: var(--violet); opacity: .3; pointer-events: none; user-select: none; }
.headline .lead { display: block; font-size: 0.3em; font-weight: 600; line-height: 1.2; margin-bottom: 0.35em; color: var(--cream); }
.headline .words { display: block; overflow-wrap: anywhere; padding-right: 0.3em; }
.headline .words .layered-stack { display: inline-block; }
.headline .plain { color: var(--cream); }
.bubbly { font-family: "Titan One", "Fredoka", "Baloo 2", system-ui, sans-serif; font-weight: 400; letter-spacing: 0; }
.label { font: 12px/1 "Rubik Mono One", sans-serif; letter-spacing: .12em; color: var(--yellow); margin: 0 0 24px; }
.variants { margin-top: 56px; display: grid; gap: 28px; }
.variants .layered-stack { font-size: clamp(1.8rem, 8vw, 3.2rem); }
.bungee { font-family: "Bungee", sans-serif; font-weight: 400; }
.bangers { font-family: "Bangers", sans-serif; font-weight: 400; letter-spacing: .03em; }
</style>
</head>
<body>
<main class="stage">
  <p class="label">RETRO LAYERED STACK</p>
  <h1 class="headline">
    <span class="lead">Designs that</span>
    <span class="words line-2"><span class="layered-stack bubbly angle-sell">sell</span><span class="plain">,</span> <span class="layered-stack bubbly angle-shine">shine</span></span>
    <span class="amp bubbly" aria-hidden="true">&amp;</span>
    <span class="words line-3"><span class="layered-stack bubbly angle-stick"><span class="accent">stick</span></span><span class="plain">.</span></span>
  </h1>

  <div class="variants">
    <p class="layered-stack bungee" data-layers="3" style="--ls-step:.06em">Three layers</p>
    <p class="layered-stack bangers" data-layers="5" style="--ls-1:var(--mint);--ls-2:var(--violet);--ls-3:var(--coral);--ls-4:var(--yellow);--ls-5:var(--mint)">Five layers, new colours</p>
  </div>
</main>
</body>
</html>
